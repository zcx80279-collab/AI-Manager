name: Windows build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Manager-Windows-x64
          path: release/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:GH_REF_NAME
          $extra = @()
          if ($tag.Contains('-')) { $extra += '--prerelease' }
          gh release create $tag release/*.exe --title $tag --generate-notes @extra
